g sinh, và cách chúng ta dùng kháng sinh, giờ đây giúp chúng ta duy trì sức khỏe, giúp chống lại tình trạng kháng kháng sinh, và đảm bảo rằng những loại thuốc cứu sinh mạng này sẽ khả dụng cho các&quot;,&quot;score&quot;:0.8711716196290145,&quot;evidence_hit&quot;:true},{&quot;rank&quot;:2,&quot;document_id&quot;:&quot;MED001&quot;,&quot;page&quot;:1,&quot;text&quot;:&quot;kháng sinh, và cách chúng ta dùng kháng sinh, giờ đây giúp chúng ta duy trì sức khỏe, giúp chống lại tình trạng kháng kháng sinh, và đảm bảo rằng những loại thuốc cứu sinh mạng này sẽ khả dụng cho các thế hệ tương lai. Nói chuyện với bác sĩ của bạn nếu bạn có bất kỳ câu hỏi nào về kháng sinh, hoặc bạn gặp phải bất kỳ tác dụng phụ nào, đặc biệt là tiêu chảy, vì đó có thể là nhiễm trùng Clostridium difficile (còn gọi là C. difficile hoặc C. diff) cần phải điều trị. C. diff có thể dẫn đến thương tổn đại tràng nghiêm trọng và tử vong. Có những tác dụng phụ gì? Các tác dụng phụ phổ biến xảy ra từ các vấn đề sức khỏe nhẹ cho đến nghiêm trọng và có thể bao gồm: • Phát ban • Chóng mặt • Buồn nôn • Tiêu chảy • Nhiễm trùng men Các tác dụng phụ nghiêm trọng hơn có thể bao gồm: • Nhiễm trùng Clostridium difficile • Phản ứng dị ứng nghiêm trọng đe dọa đến tính mạng Để tìm hiểu thêm về việc kê đơn và sử dụng kháng sinh, truy cập www.cdc.gov/antibiotic-use.&quot;,&quot;score&quot;:0.870916485786438,&quot;evidence_hit&quot;:false},{&quot;rank&quot;:3,&quot;document_id&quot;:&quot;MED001&quot;,&quot;page&quot;:2,&quot;text&quot;:&quot;Tại sao Có ý thức về kháng sinh lại có ý nghĩa quan trọng? Kháng sinh cứu sinh mạng. Khi một bệnh nhân cần kháng sinh, những lợi ích của kháng sinh vượt trội so với những rủi ro của tác dụng phụ hoặc kháng kháng sinh. Khi không cần kháng sinh, chúng sẽ không giúp ích cho bạn, và tác dụng phụ vẫn có thể làm hại bạn. Các phản ứng từ kháng sinh gây ra 1 trên 5 các ca cấp cứu liên quan đến thuốc. Tôi có thể giữ gìn sức khỏe như thế nào? Bạn có thể giữ gìn sức khỏe và giữ cho những người  được hỗ trợ từ người tương tự trong việc kiểm soát bệnh tiểu đường. • Đọc trực tuyến về bệnh tiểu đường. Truy cập http://www.cdc.gov/diabetes/ndep/index.htm/ Thận trọng thực sự với bệnh tiểu đường. Bạn có thể đã nghe nhiều người nói là họ có \&quot;chút bệnh tiểu đường\&quot; hoặc \&quot;mức đường hơi cao\&quot;. Những từ ngữ này ám chỉ rằng bệnh tiểu đường không phải là bệnh nghiêm trọng. Điều đó là không đúng. Bệnh tiểu đường là bệnh nghiêm trọng, nhưng bạn có thể kiểm soát bệnh. Người bị bệnh tiểu đường cần chọn lựa thức ăn lành mạnh, duy trì cân nặng hợp lý, hoạt động nhiều hơn mỗi ngày và dùng thuốc ngay cả khi họ thấy khỏe. Có nhiều điều cần làm. Thật không đơn giản nhưng đáng để làm!&quot;,&quot;score&quot;:0.89517742395401,&quot;evidence_hit&quot;:true},{&quot;rank&quot;:2,&quot;document_id&quot;:&quot;MED004&quot;,&quot;page&quot;:6,&quot;text&quot;:&quot;4 Tại sao cần phải chăm sóc bệnh tiểu đường? Chăm sóc bản thân và bệnh tiểu đường của sẽ giúp bạn cảm thấy khỏe mạnh ngay hôm nay và trong tương lai. Khi mức đường trong máu (glucoza) ở gần với mức bình thường thì bạn có thể: • có nhiều sinh lực hơn • ít mệt và khát nước hơn • đi tiểu ít thường xuyên hơn • lành vết thương tốt hơn • ít bị nhiễm trùng da hay bàng quang hơn Bạn cũng sẽ có ít nguy cơ hơn gặp phải những vấn đề sức khỏe do bệnh tiểu đường gây ra như: • đau tim và đột quỵ • vấn đề về mắt có thể dẫn đến giảm về thị lực hoặc mù • đau, đau nhói dây thần kinh, hay tê ở bàn tay và bàn chân, còn gọi là hư dây thần kinh • vấn đề về thận có thể khiến thận ngừng hoạt động • vấn đề về răng và nướu Những hoạt động bạn có thể thực hiện • Hỏi nhóm chăm sóc sức khỏe để biết bạn bị bệnh tiểu đường loại nào. • Hỏi xem bạn có thể đến nơi nào để được hỗ trợ. • Học cách chăm sóc bệnh tiểu đường sẽ giúp bạn cảm thấy khỏe mạnh ngay hôm nay và trong tương lai.&quot;,&quot;score&quot;:0.8853102394753567,&quot;evidence_hit&quot;:false},{&quot;rank&quot;:3,&quot;document_id&quot;:&quot;MED004&quot;,&quot;page&quot;:10,& ot;gold_page&quot;:3,&quot;evidence_quote&quot;:&quot;Bệnh tiểu đường loại 2 là loại tiểu đường phổ biến nhất.&quot;},&quot;strategies&quot;:{&quot;A&quot;:{&quot;hit_at_1&quot;:true,&quot;hit_at_3&quot;:true,&quot;applied_filter&quot;:{},&quot;top_3&quot;:[{&quot;rank&quot;:1,&quot;document_id&quot;:&quot;MED004&quot;,&quot;page&quot;:3,&quot;text&quot;:&quot;1 Những hoạt động bạn có thể thực hiện Các dấu trong tập sách này cho biết những hoạt động bạn có thể thực hiện để kiểm soát bệnh tiểu đường. • Giúp nhóm chăm sóc sức khỏe lên kế hoạch chăm sóc bệnh tiểu đường thích hợp với bạn. • Học cách chọn lựa khôn ngoan để chăm sóc bệnh tiểu đường hàng ngày. BƯỚC 1: Tìm hiểu về bệnh tiểu đường. Tiểu đường là gì? Có ba loại bệnh tiểu đường chính: • Bệnh tiểu đường loại 1 – Cơ thể không tạo ra insulin. Đây là vấn đề vì bạn cần insulin để lấy đường (glucoza) từ thức ăn do bạn ăn vào và chuyển thành năng lượng cho cơ thể. Bạn cần dùng insulin hàng ngày để sống. • Bệnh tiểu đường loại 2 – Cơ thể không tạo ra hoặc không sử dụng tốt insulin. Bạn có thể phải dùng thuốc viên hoặc insulin để kiểm soát bệnh tiểu đường. Bệnh tiểu đường loại 2 là loại tiểu đường phổ biến nhất. • Bệnh tiểu đường lúc mang thai – Một số phụ nữ mắc loại bệnh tiểu đường này khi mang thai. Trong hầu hết các trường hợp, bệnh này sẽ khỏi sau khi sinh con. Nhưng ngay cả khi khỏi bệnh thì những phụ nữ này và con của họ cũng có nguy cơ mắc bệnh tiểu đường sau này cao hơn.&quot;,&quot;score&quot;:0.8804016780613868,&quot;evidence_hit&quot;:true},{&quot;rank&quot;:2,&quot;document_id&quot;:&quot;MED004&quot;,&quot;page&quot;:4,&quot;text&quot;:&quot;2 Bạn là người quan trọng nhất trong nhóm chăm sóc sức khỏe của bạn. Bạn là người kiểm soát bệnh tiểu đường của mình từng ngày. Hỏi bác sĩ về cách bạn chăm sóc tốt nhất cho bệnh tiểu đường để sống khỏe mạnh. Một số người khác có thể giúp ích bao gồm: • nha sĩ • bác sĩ trị bệnh tiểu đường • giáo dục viên về bệnh tiểu đường • chuyên viên về dinh dưỡng • bác sĩ nhãn khoa uot;,&quot;page&quot;:1,&quot;text&quot;:&quot;kháng sinh, và cách chúng ta dùng kháng sinh, giờ đây giúp chúng ta duy trì sức khỏe, giúp chống lại tình trạng kháng kháng sinh, và đảm bảo rằng những loại thuốc cứu sinh mạng này sẽ khả dụng cho các thế hệ tương lai. Nói chuyện với bác sĩ của bạn nếu bạn có bất kỳ câu hỏi nào về kháng sinh, hoặc bạn gặp phải bất kỳ tác dụng phụ nào, đặc biệt là tiêu chảy, vì đó có thể là nhiễm trùng Clostridium difficile (còn gọi là C. difficile hoặc C. diff) cần phải điều trị. C. diff có thể dẫn đến thương tổn đại tràng nghiêm trọng và tử vong. Có những tác dụng phụ gì? Các tác dụng phụ phổ biến xảy ra từ các vấn đề sức khỏe nhẹ cho đến nghiêm trọng và có thể bao gồm: • Phát ban • Chóng mặt • Buồn nôn • Tiêu chảy • Nhiễm trùng men Các tác dụng phụ nghiêm trọng hơn có thể bao gồm: • Nhiễm trùng Clostridium difficile • Phản ứng dị ứng nghiêm trọng đe dọa đến tính mạng Để tìm hiểu thêm về việc kê đơn và sử dụng kháng sinh, truy cập www.cdc.gov/antibiotic-use.&quot;,&quot;score&quot;:0.8714983463287354,&quot;evidence_hit&quot;:false},{&quot;rank&quot;:3,&quot;document_id&quot;:&quot;MED001&quot;,&quot;page&quot;:1,&quot;text&quot;:&quot;Mỗi năm ở Hoa Kỳ ít nhất 2 triệu người bị nhiễm vi khuẩn kháng kháng sinh. Kết quả là ít nhất 23.000 người chết. Kháng sinh không phải bao giờ cũng là câu trả lời. SỬ DỤNG THÔNG MINH, CHĂM SÓC TỐT NHẤT CÓ Ý THỨC VỀ KHÁNG SINH Tại sao dùng kháng sinh lại dẫn đến kháng kháng sinh? Bất cứ lúc nào sử dụng kháng sinh, chúng có thể gây ra những tác dụng phụ và dẫn đến kháng kháng sinh. Kháng kháng sinh là một trong những mối đe dọa khẩn cấp nhất đối với sức khỏe của công chúng. Luôn nhớ rằng: 1. Kháng kháng sinh không có nghĩa là cơ thể trở nên kháng kháng sinh; điều này có nghĩa là vi khuẩn đã trở nên kháng lại với kháng sinh được thiết kế để tiêu diệt chúng. 2. Khi vi khuẩn trở nên kháng thuốc, kháng sinh không thể tiêu diệt chúng, và vi khuẩn nhân lên nhiều lần. 3. Một số vi khuẩn kháng thuốc có thể khó điều   const root = document.getElementById(&quot;day06-benchmark-view&quot;);
  const questionSelect = root.querySelector(&quot;#day06-question&quot;);
  const strategySelect = root.querySelector(&quot;#day06-strategy&quot;);
  const questionLabel = root.querySelector(&quot;[data-question]&quot;);
  const hit1 = root.querySelector(&quot;[data-hit1]&quot;);
  const hit3 = root.querySelector(&quot;[data-hit3]&quot;);
  const scope = root.querySelector(&quot;[data-scope]&quot;);
  const goldSource = root.querySelector(&quot;[data-gold-source]&quot;);
  const answer = root.querySelector(&quot;[data-answer]&quot;);
  const evidence = root.querySelector(&quot;[data-evidence]&quot;);
  const results = root.querySelector(&quot;[data-results]&quot;);

  for (const [id, record] of Object.entries(data.questions)) {
    const label = record.question.split === &quot;dev&quot; ? &quot;Dev&quot; : &quot;Test&quot;;
    questionSelect.add(new Option(label + &quot; · &quot; + id, id));
  }

  function setHit(label, name, value) {
    label.className = value ? &quot;day06-hit&quot; : &quot;day06-miss&quot;;
    label.textContent = name + &quot; · &quot; + (value ? &quot;Đạt&quot; : &quot;Trượt&quot;);
  }

  function fillChunk(target, text, quote) {
    const compact = text.replace(/\s+/gu, &quot; &quot;).trim();
    const at = quote ? compact.indexOf(quote) : -1;
    if (at &lt; 0) {
      target.textContent = text;
      return;
    }
    const mark = document.createElement(&quot;mark&quot;);
    mark.textContent = quote;
    target.append(compact.slice(0, at), mark, compact.slice(at + quote.length));
  }

  function render() {
    const record = data.questions[questionSelect.value];
    const question = record.question;
    const trace = record.strategies[strategySelect.value];
    questionLabel.textContent = question.question;
    setHit(hit1, &quot;Hit@1&quot;, trace.hit_at_1);
    setHit(hit3, &quot;Hit@3&quot;, trace.hit_at_3);
    scope.textContent = trace.applied_filter.topic ? &quot;Lọc topic · &quot; + trace.applied_filter.topic : &quot;Toàn corpus&quot;;
    goldSource.textContent = data.sources[question.gold_source_id] + &quot; · PDF trang &quot; + question.gold_page;
    answer.textContent = question.expected_answer;
    evidence.textContent = question.evidence_quote;
    results.replaceChildren();

    for (const hit of trace.top_3) {
      const row = results.insertRow();
      row.insertCell().textContent = hit.rank;
      const cell = row.insertCell();
      const details = document.createElement(&quot;details&quot;);
      const label = document.createElement(&quot;summary&quot;);
      label.className = &quot;cursor-interaction&quot;;
      label.textContent = data.sources[hit.document_id] + &quot; · PDF trang &quot; + hit.page;
      const chunk = document.createElement(&quot;p&quot;);
      chunk.className = &quot;day06-chunk&quot;;
      fillChunk(chunk, hit.text, hit.evidence_hit ? question.evidence_quote : &quot;&quot;);
      details.append(label, chunk);
      cell.append(details);
      const score = row.insertCell();
      score.className = &quot;text-end tabular-nums&quot;;
      score.textContent = hit.score.toLocaleString(&quot;vi-VN&quot;, {minimumFractionDigits: 3, maximumFractionDigits: 3});
      setHit(row.insertCell(), &quot;Hit&quot;, hit.evidence_hit);
    }
  }

  function restore(state) {
    const saved = state?.privateContent;
    questionSelect.value = Object.hasOwn(data.questions, saved?.question) ? saved.question : &quot;q20&quot;;
    strategySelect.value = [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;].includes(saved?.strategy) ? saved.strategy : &quot;B&quot;;
    render();
  }

  function onChange() {
    render();
    const selection = {question: questionSelect.value, strategy: strategySelect.value};
    window.openai?.setWidgetState?.({modelContent: selection, privateContent: selection})?.catch(() =&gt; {});
  }

  questionSelect.addEventListener(&quot;change&quot;, onChange);

    if (globals &amp;&amp; &quot;widgetState&quot; in globals) restore(globals.widgetState);
  });
  restore(window.openai?.widgetState);
})();
